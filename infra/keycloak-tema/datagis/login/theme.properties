# Tema de login do DataGIS (LIZARDS-61). Herda tudo do tema padrao do Keycloak 26
# (keycloak.v2, PatternFly 5) e so acrescenta o datagis.css por cima: nenhum template
# (.ftl) e reescrito, entao login, troca de senha obrigatoria e mensagens de erro
# continuam os do Keycloak, e uma atualizacao do Keycloak nao quebra o tema.
# Ativado no realm pelo KeycloakProvisionador (app.keycloak.tema-login).
parent=keycloak.v2
styles=css/styles.css css/datagis.css
# Rotulo flutuante (placeholder vazio nos campos, o field.ftl nao tem) e rodape com o direito autoral
# e link para o GitHub da equipe (o CSS so cria texto, nao link)
scripts=js/datagis.js
