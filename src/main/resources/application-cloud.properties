# Perfil pra conectar no Autonomous AI Database (Oracle Cloud, Always Free) via mTLS
# com Wallet - exigencia da FATEC (docs/analise-hospedagem-autonomous-database-2026-09-22.md
# §3.3/§5.2). Nao usar em vez do perfil "docker"/"dev" - e so pra quando alguem
# explicitamente quiser rodar contra a instancia "datagis" na nuvem.
#
# Pre-requisitos antes de usar este perfil:
#   1. Baixar o Wallet no console OCI (Autonomous Database > datagis > Database Connection
#      > Download Wallet) e extrair em wallet/ na raiz do projeto (gitignored - nunca commitar).
#   2. Copiar .env.cloud.example para .env.cloud (tambem gitignored) e preencher os valores.
#   3. Exportar as variaveis abaixo antes de rodar (ou usar um plugin que leia .env.cloud).
#
# CLOUD_TNS_NAME = nome do perfil de conexao dentro do tnsnames.ora da wallet
#   (ex.: datagis_high, datagis_medium, datagis_low - ver arquivo wallet/tnsnames.ora).
# TNS_ADMIN = caminho ate a pasta da wallet (relativo ./wallet funciona rodando o
#   mvnw a partir da raiz do projeto; caminho absoluto se rodar de outro lugar).
spring.datasource.url=jdbc:oracle:thin:@${CLOUD_TNS_NAME:datagis_high}?TNS_ADMIN=${TNS_ADMIN:./wallet}
spring.datasource.username=${CLOUD_DB_USERNAME:ADMIN}
spring.datasource.password=${CLOUD_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# [ACHADO 2026-09-22, LIZARDS-3] Local, o backend conecta COMO o dono das tabelas
# (usuario CONTROLE) - toda referencia sem prefixo de schema (JPA e as varias queries
# JDBC cruas do projeto - PersistidorSilverService, OrquestradorValidacao etc.) resolve
# certo por conta disso. Na nuvem conectamos como ADMIN (dono != schema onde o Flyway
# criou as tabelas), entao qualquer SQL sem prefixo quebra com ORA-00942 "tabela nao
# existe" mesmo a tabela existindo em CONTROLE. Fix: fixar o schema padrao da sessao na
# conexao, sem precisar prefixar nada em lugar nenhum do codigo.
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA=CONTROLE

# NAO seguir o tutorial de referencia aqui: ele sugere spring.jpa.hibernate.ddl-auto=update,
# mas este projeto usa Flyway como fonte de verdade do schema (application.properties ja
# define ddl-auto=none) - manter assim tambem na nuvem, senao o Hibernate tenta alterar
# tabela por conta propria e conflita com as migrations.
