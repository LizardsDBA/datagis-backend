spring.application.name=datagis
 
# Flyway com schemas separados por camada. Uma instancia so, versao global.
spring.flyway.schemas=CONTROLE,BRONZE,SILVER,GOLD,QUARENTENA
spring.flyway.default-schema=CONTROLE
spring.flyway.locations=classpath:db/migration/controle,classpath:db/migration/bronze,classpath:db/migration/silver,classpath:db/migration/gold,classpath:db/migration/quarentena,classpath:db/migration/seed-demo
# seed-demo = dados FALSOS pra o time desenvolver as telas que dependem de Silver/Gold/
# Quarentena antes da transformacao Bronze->Silver existir. Pra parar de aplicar: tirar
# 'classpath:db/migration/seed-demo' da linha acima. Some quando a transformacao entrar.
spring.flyway.placeholders.controleSchema=CONTROLE
spring.flyway.placeholders.bronzeSchema=BRONZE
spring.flyway.placeholders.silverSchema=SILVER
spring.flyway.placeholders.goldSchema=GOLD
spring.flyway.placeholders.quarentenaSchema=QUARENTENA
 
# O Flyway cuida do schema, o Hibernate nao precisa revalidar.
# ddl-auto=validate era usado antes, mas falha com Oracle Spatial porque o driver
# retorna o tipo como 'sdo_geometry' enquanto o Hibernate espera 'mdsys.sdo_geometry'
# (bug conhecido do Hibernate Spatial + Oracle). Como o Flyway ja garante a consistencia
# do schema, desabilitamos a validacao do Hibernate aqui.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Upload de fonte UPLOAD_MANUAL (ex.: .zip de Shapefile do CAR baixado por estado).
# Historico de tamanho real encontrado: 218MB (menor caso) -> 1GB+ -> 3,24GB (achado
# 2026-09-11, estourou o teto de 2GB configurado antes: SizeLimitExceededException,
# "3477706048 exceeds the configured maximum (2147483648)"). Em vez de continuar
# perseguindo um teto fixo a cada arquivo maior do CAR, tiramos o limite
# (-1 = sem limite nas 4 propriedades; server.tomcat.max-http-form-post-size as vezes
# limita multipart tambem, dependendo da versao do Tomcat - por isso as 4 juntas).
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
# Onde ArmazenamentoArquivoBrutoLocalFs guarda o arquivo entre o upload e a leitura.
app.armazenamento.diretorio=/tmp/datagis-uploads