spring.application.name=datagis
 
# Flyway com schemas separados por camada. Uma instancia so, versao global.
# So CONTROLE/BRONZE por enquanto - o resto entra quando tiver migration.
spring.flyway.schemas=CONTROLE,BRONZE
spring.flyway.default-schema=CONTROLE
spring.flyway.locations=classpath:db/migration/controle,classpath:db/migration/bronze
spring.flyway.placeholders.controleSchema=CONTROLE
spring.flyway.placeholders.bronzeSchema=BRONZE
 
# O Flyway cuida do schema, o Hibernate so confere se bate com as entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
 
# Fonte do CAR/SICAR. A lista de municipios e configuravel, pra dar pra
# crescer o "circuito" sem mexer em codigo.
app.car.wfs-url=https://geoserver.car.gov.br/geoserver/sicar/wfs
app.car.layer=sicar:sicar_imoveis_pr
app.car.municipios-ibge=4106902,4115200,4119905