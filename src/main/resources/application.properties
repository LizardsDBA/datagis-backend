spring.application.name=datagis

# Login/RBAC via Keycloak (LIZARDS-47). O backend nao tem tela de login nem guarda
# senha: so valida o JWT que o Keycloak emitiu pro frontend.
# - url-publica: endereco que o NAVEGADOR usa -> vira o "iss" do token (validado aqui).
# - url-interna: endereco que o BACKEND usa pra buscar as chaves e chamar a Admin API.
#   Iguais quando o backend roda na IDE; no compose a interna e http://keycloak:8080.
app.keycloak.url-publica=${KEYCLOAK_URL_PUBLICA:http://localhost:8180}
app.keycloak.url-interna=${KEYCLOAK_URL_INTERNA:http://localhost:8180}
app.keycloak.realm=datagis
app.keycloak.client-id=datagis-backend
app.keycloak.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:datagis-backend-dev-secret}
# Sincroniza roles/perfis do codigo com o Keycloak na subida (KeycloakProvisionador).
# Desligado por padrao pra teste nao depender do Keycloak; ligado no compose e no perfil dev.
app.keycloak.provisionar=false
# Cria um usuario de teste por perfil (senha = nome do usuario). SO desenvolvimento.
app.keycloak.usuarios-dev=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.keycloak.url-publica}/realms/${app.keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.keycloak.url-interna}/realms/${app.keycloak.realm}/protocol/openid-connect/certs

# GeoServer do mapa de cobertura (LIZARDS-35). O navegador so chega nele pelo proxy
# /api/indicadores/geoserver/{wms|wfs}. No compose o endereco e http://geoserver:8080/geoserver;
# o padrao abaixo serve pro backend rodando na IDE, com o GeoServer do compose na porta 8085.
app.geoserver.url=${GEOSERVER_URL:http://localhost:8085/geoserver}
app.geoserver.timeout=30s

# Flyway com schemas separados por camada. Uma instancia so, versao global.
spring.flyway.schemas=CONTROLE,BRONZE,SILVER,GOLD,QUARENTENA,QUARTZ
spring.flyway.default-schema=CONTROLE
spring.flyway.locations=classpath:db/migration/controle,classpath:db/migration/bronze,classpath:db/migration/silver,classpath:db/migration/gold,classpath:db/migration/quarentena,classpath:db/migration/quartz
# Espera o Oracle subir (5s x 60 = ate 5 min) em vez de derrubar o backend. No reboot
# do PC o Docker religa os containers todos juntos (restart: unless-stopped ignora o
# depends_on), e o backend chegava antes do banco estar pronto.
spring.flyway.connect-retries=60
spring.flyway.connect-retries-interval=5
spring.flyway.placeholders.controleSchema=CONTROLE
spring.flyway.placeholders.bronzeSchema=BRONZE
spring.flyway.placeholders.silverSchema=SILVER
spring.flyway.placeholders.goldSchema=GOLD
spring.flyway.placeholders.quarentenaSchema=QUARENTENA
spring.flyway.placeholders.quartzSchema=QUARTZ
 
# O Flyway cuida do schema, o Hibernate nao precisa revalidar.
# ddl-auto=validate era usado antes, mas falha com Oracle Spatial porque o driver
# retorna o tipo como 'sdo_geometry' enquanto o Hibernate espera 'mdsys.sdo_geometry'
# (bug conhecido do Hibernate Spatial + Oracle). Como o Flyway ja garante a consistencia
# do schema, desabilitamos a validacao do Hibernate aqui.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Upload de fonte UPLOAD_MANUAL (ex.: .zip de Shapefile do CAR baixado por estado).
# Historico de tamanho real encontrado: 218MB (menor caso) -> 1GB+ -> 3,24GB (achado
# 2026-09-11, estourou o teto de 2GB configurado antes: SizeLimitExceededException,
# "3477706048 exceeds the configured maximum (2147483648)"). Em vez de continuar
# perseguindo um teto fixo a cada arquivo maior do CAR, tiramos o limite
# (-1 = sem limite nas 4 propriedades; server.tomcat.max-http-form-post-size as vezes
# limita multipart tambem, dependendo da versao do Tomcat - por isso as 4 juntas).
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
# Onde ArmazenamentoArquivoBrutoLocalFs guarda o arquivo entre o upload e a leitura.
app.armazenamento.diretorio=/tmp/datagis-uploads

# Quartz - troca RAMJobStore por JDBC JobStore (persistência em banco)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.oracle.OracleDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QUARTZ.QRTZ_
spring.quartz.properties.org.quartz.jobStore.useProperties=false
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=false