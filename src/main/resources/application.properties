spring.application.name=datagis

# Flyway (CLAUDE.md §2.1.1) - uma instancia so, schemas explicitos, versao global.
# So CONTROLE/BRONZE por enquanto; SILVER/GOLD/QUARENTENA/QUARTZ/BATCH entram na
# lista + em locations quando as migrations delas existirem.
spring.flyway.schemas=CONTROLE,BRONZE
spring.flyway.default-schema=CONTROLE
spring.flyway.locations=classpath:db/migration/controle,classpath:db/migration/bronze
spring.flyway.placeholders.controleSchema=CONTROLE
spring.flyway.placeholders.bronzeSchema=BRONZE

# JPA/Hibernate - schema e todo gerenciado pelo Flyway, Hibernate so valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fonte CAR/SICAR (CLAUDE.md §5.6) - "circuito" de municipios e config, expansivel
# sem mexer em codigo (§5.2): Curitiba, Maringa, Ponta Grossa.
app.car.wfs-url=https://geoserver.car.gov.br/geoserver/sicar/wfs
app.car.layer=sicar:sicar_imoveis_pr
app.car.municipios-ibge=4106902,4115200,4119905
