spring.application.name=datagis
 
# Flyway com schemas separados por camada. Uma instancia so, versao global.
spring.flyway.schemas=CONTROLE,BRONZE,SILVER,GOLD,QUARENTENA
spring.flyway.default-schema=CONTROLE
spring.flyway.locations=classpath:db/migration/controle,classpath:db/migration/bronze,classpath:db/migration/silver,classpath:db/migration/gold,classpath:db/migration/quarentena,classpath:db/migration/seed-demo
# seed-demo = dados FALSOS pra o time desenvolver as telas que dependem de Silver/Gold/
# Quarentena antes da transformacao Bronze->Silver existir. Pra parar de aplicar: tirar
# 'classpath:db/migration/seed-demo' da linha acima. Some quando a transformacao entrar.
spring.flyway.placeholders.controleSchema=CONTROLE
spring.flyway.placeholders.bronzeSchema=BRONZE
spring.flyway.placeholders.silverSchema=SILVER
spring.flyway.placeholders.goldSchema=GOLD
spring.flyway.placeholders.quarentenaSchema=QUARENTENA
 
# O Flyway cuida do schema, o Hibernate so confere se bate com as entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Upload de fonte UPLOAD_MANUAL (ex.: .zip de Shapefile do CAR). Default do Spring
# (1MB) e pequeno demais pra shapefile estadual - CAR/PR sozinho ja passa disso.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# Onde ArmazenamentoArquivoBrutoLocalFs guarda o arquivo entre o upload e a leitura.
app.armazenamento.diretorio=/tmp/datagis-uploads